<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Umbra Beauty Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-wrap">
      <a href="/" class="logo">Umbra <span>Beauty</span></a>
      <div class="nav-links">
        <a href="/">Inicio</a>
        <a href="/#servicios">Servicios</a>
        <a href="/tienda">Tienda</a>
        <a href="/agendar">Agendar</a>
        <a href="/admin" class="btn-pink admin-link">Admin</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-grid">
      <div>
        <h4>Umbra Beauty Studio</h4>
        <p>Estética, belleza y atención boutique en Playa del Carmen.</p>
      </div>
      <div>
        <h5>Horario</h5>
        <small>Lun - Sab: 10:00 - 20:00</small>
      </div>
      <div>
        <h5>Contacto</h5>
        <small>WhatsApp +52 984 123 4567</small>
      </div>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
  <script src="/static/js/main.js"></script>
</body>
</html>
